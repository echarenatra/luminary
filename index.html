<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Luminary — A new light, every day. Daily inspiration quotes." />
  <meta name="theme-color" content="#FAF9F6" id="meta-theme-color" />

  <!-- Open Graph -->
  <meta property="og:title" content="Luminary" />
  <meta property="og:description" content="A new light, every day." />
  <meta property="og:type" content="website" />

  <title>Luminary — A new light, every day.</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="favicon.svg" />

  <!-- Fonts (T-09) — self-hosted, no render-blocking third-party request -->
  <link rel="preload" href="/fonts/playfair-display-latin-400-italic.woff2" as="font" type="font/woff2" crossorigin />

  <!-- Styles -->
  <link rel="stylesheet" href="style.css" />

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
</head>

<body>

  <!-- SVG icon sprites -->
  <svg hidden aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <defs>

      <symbol id="ic-sliders-horizontal" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 5H3"/><path d="M12 19H3"/><path d="M14 3v4"/><path d="M16 17v4"/><path d="M21 12h-9"/><path d="M21 19h-5"/><path d="M21 5h-7"/><path d="M8 10v4"/><path d="M8 12H3"/>
      </symbol>

      <symbol id="ic-bookmark" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 3a2 2 0 0 1 2 2v15a1 1 0 0 1-1.496.868l-4.512-2.578a2 2 0 0 0-1.984 0l-4.512 2.578A1 1 0 0 1 5 20V5a2 2 0 0 1 2-2z"/>
      </symbol>

      <symbol id="ic-sun" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>
      </symbol>

      <symbol id="ic-moon" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/>
      </symbol>

      <symbol id="ic-sunrise" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2v8"/><path d="m4.93 10.93 1.41 1.41"/><path d="M2 18h2"/><path d="M20 18h2"/><path d="m19.07 10.93-1.41 1.41"/><path d="M22 22H2"/><path d="m8 6 4-4 4 4"/><path d="M16 18a4 4 0 0 0-8 0"/>
      </symbol>

      <symbol id="ic-copy" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
      </symbol>

      <symbol id="ic-share-2" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" x2="15.42" y1="13.51" y2="17.49"/><line x1="15.41" x2="8.59" y1="6.51" y2="10.49"/>
      </symbol>

      <symbol id="ic-heart" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5"/>
      </symbol>

      <symbol id="ic-download" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/>
      </symbol>

      <symbol id="ic-arrow-left" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>
      </symbol>

      <symbol id="ic-refresh-cw" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>
      </symbol>

      <symbol id="ic-arrow-right" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>
      </symbol>

      <symbol id="ic-x" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
      </symbol>

      <symbol id="ic-check" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 6 9 17l-5-5"/>
      </symbol>

    </defs>
  </svg>


  <!-- ═══════════════════════════════════════
       HEADER
  ═══════════════════════════════════════ -->
  <header class="site-header" role="banner">
    <div class="header-inner">

      <!-- Logo -->
      <a href="/" class="logo" aria-label="Luminary — Home">
        <svg class="logo-icon" width="22" height="26" viewBox="0 0 28 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M14 1C14 1 5 9.5 5 17.5C5 22.6 9.03 27 14 27C18.97 27 23 22.6 23 17.5C23 9.5 14 1 14 1Z" fill="currentColor" opacity="0.90"/>
          <path d="M14 10C14 10 10 14.5 10 17.8C10 20.12 11.79 22 14 22C16.21 22 18 20.12 18 17.8C18 14.5 14 10 14 10Z" fill="currentColor" opacity="0.35"/>
          <rect x="12.5" y="27" width="3" height="4" rx="1.5" fill="currentColor" opacity="0.45"/>
        </svg>
        <span class="logo-wordmark">Luminary</span>
      </a>

      <!-- Header Actions -->
      <div class="header-actions">

        <!-- Category Filter Toggle -->
        <button
          class="btn-icon"
          id="btn-filter"
          aria-label="Filter by category"
          aria-expanded="false"
          aria-controls="category-drawer"
        >
          <svg class="icon" aria-hidden="true" width="18" height="18"><use href="#ic-sliders-horizontal"/></svg>
        </button>

        <!-- Favorites Toggle -->
        <button
          class="btn-icon"
          id="btn-favorites"
          aria-label="Saved quotes"
          aria-expanded="false"
          aria-controls="favorites-drawer"
        >
          <svg class="icon" aria-hidden="true" width="18" height="18"><use href="#ic-bookmark"/></svg>
          <span class="favorites-count" id="favorites-count" aria-live="polite" hidden>0</span>
        </button>

        <!-- Theme Toggle -->
        <button
          class="btn-icon btn-theme"
          id="btn-theme"
          aria-label="Switch to dark mode"
        >
          <svg class="icon icon-sun" aria-hidden="true" width="18" height="18"><use href="#ic-sun"/></svg>
          <svg class="icon icon-moon" aria-hidden="true" width="18" height="18"><use href="#ic-moon"/></svg>
        </button>

      </div>
    </div>
  </header>


  <!-- ═══════════════════════════════════════
       CATEGORY FILTER DRAWER
  ═══════════════════════════════════════ -->
  <aside
    class="drawer drawer-top"
    id="category-drawer"
    role="region"
    aria-label="Category filter"
    hidden
  >
    <div class="drawer-inner">
      <p class="drawer-label">Filter by category</p>
      <nav class="category-chips" aria-label="Quote categories">
        <button class="chip chip-active" data-category="all">All</button>
        <button class="chip" data-category="courage">Courage</button>
        <button class="chip" data-category="mindset">Mindset</button>
        <button class="chip" data-category="creativity">Creativity</button>
        <button class="chip" data-category="stoicism">Stoicism</button>
        <button class="chip" data-category="success">Success</button>
        <button class="chip" data-category="kindness">Kindness</button>
        <button class="chip" data-category="love">Love</button>
        <button class="chip" data-category="wisdom">Wisdom</button>
      </nav>
    </div>
  </aside>


  <!-- ═══════════════════════════════════════
       MAIN CONTENT
  ═══════════════════════════════════════ -->
  <main class="main" id="main" role="main">

    <!-- Daily Quote Badge -->
    <div class="daily-badge" aria-label="Today's quote">
      <svg class="icon" aria-hidden="true" width="18" height="18"><use href="#ic-sunrise"/></svg>
      <span>Today's Quote</span>
    </div>

    <!-- Quote Card -->
    <article class="quote-card" id="quote-card" aria-live="polite" aria-atomic="true">
      <div class="quote-card-inner">

        <!-- Opening decorative quote mark -->
        <span class="quote-mark quote-mark-open" aria-hidden="true">&ldquo;</span>

        <blockquote class="quote-text" id="quote-text">
          <!-- Quote text injected by JS -->
        </blockquote>

        <footer class="quote-footer">
          <cite class="quote-author" id="quote-author">
            <!-- Author injected by JS -->
          </cite>
          <span class="quote-category" id="quote-category">
            <!-- Category injected by JS -->
          </span>
        </footer>

        <!-- Closing decorative quote mark -->
        <span class="quote-mark quote-mark-close" aria-hidden="true">&rdquo;</span>

      </div>
    </article>

    <!-- Quote Actions -->
    <div class="quote-actions" role="toolbar" aria-label="Quote actions">

      <button class="btn-action" id="btn-copy" aria-label="Copy quote to clipboard">
        <svg class="icon" aria-hidden="true" width="18" height="18"><use href="#ic-copy"/></svg>
        <span>Copy</span>
      </button>

      <button class="btn-action" id="btn-share" aria-label="Share this quote">
        <svg class="icon" aria-hidden="true" width="18" height="18"><use href="#ic-share-2"/></svg>
        <span>Share</span>
      </button>

      <button class="btn-action btn-favorite" id="btn-favorite" aria-label="Save quote to favorites" aria-pressed="false">
        <svg class="icon" aria-hidden="true" width="18" height="18"><use href="#ic-heart"/></svg>
        <span>Save</span>
      </button>

      <button class="btn-action" id="btn-download" aria-label="Download quote as image">
        <svg class="icon" aria-hidden="true" width="18" height="18"><use href="#ic-download"/></svg>
        <span>Download</span>
      </button>

    </div>

    <!-- Navigation -->
    <nav class="quote-nav" aria-label="Browse quotes">
      <button class="btn-nav" id="btn-prev" aria-label="Previous quote">
        <svg class="icon" aria-hidden="true" width="18" height="18"><use href="#ic-arrow-left"/></svg>
      </button>

      <button class="btn-new" id="btn-next" aria-label="New Quote">
        <svg class="icon" aria-hidden="true" width="18" height="18"><use href="#ic-refresh-cw"/></svg>
        <span>New Quote</span>
      </button>

      <button class="btn-nav" id="btn-next-arrow" aria-label="Next quote">
        <svg class="icon" aria-hidden="true" width="18" height="18"><use href="#ic-arrow-right"/></svg>
      </button>
    </nav>

    <!-- Keyboard shortcut hint (shown once) -->
    <p class="keyboard-hint" id="keyboard-hint" hidden>
      <kbd>←</kbd><kbd>→</kbd> browse &nbsp;·&nbsp; <kbd>F</kbd> favorite &nbsp;·&nbsp; <kbd>C</kbd> copy &nbsp;·&nbsp; <kbd>T</kbd> theme
    </p>

  </main>


  <!-- ═══════════════════════════════════════
       FAVORITES DRAWER
  ═══════════════════════════════════════ -->
  <aside
    class="drawer drawer-right"
    id="favorites-drawer"
    aria-label="Saved quotes"
    hidden
  >
    <div class="drawer-header">
      <h2 class="drawer-title">Saved Quotes</h2>
      <button class="btn-icon" id="btn-close-favorites" aria-label="Close favorites">
        <svg class="icon" aria-hidden="true" width="18" height="18"><use href="#ic-x"/></svg>
      </button>
    </div>
    <div class="drawer-body">
      <ul class="favorites-list" id="favorites-list" role="list">
        <!-- Favorites injected by JS -->
      </ul>
      <p class="favorites-empty" id="favorites-empty">
        No saved quotes yet.<br />
        <span>Hit the heart button to save one.</span>
      </p>
    </div>
  </aside>

  <!-- Drawer backdrop -->
  <div class="drawer-backdrop" id="drawer-backdrop" aria-hidden="true" hidden></div>


  <!-- ═══════════════════════════════════════
       DOWNLOAD MODAL
  ═══════════════════════════════════════ -->
  <dialog
    class="modal"
    id="download-modal"
    aria-labelledby="modal-title"
    aria-modal="true"
  >
    <div class="modal-inner">
      <h2 class="modal-title" id="modal-title">Download Quote Card</h2>
      <p class="modal-subtitle">Choose a style for your image</p>

      <div class="modal-options">
        <button class="modal-option" data-export-theme="light" aria-label="Download in light style">
          <span class="modal-option-preview modal-option-light">Aa</span>
          <span>Light</span>
        </button>
        <button class="modal-option" data-export-theme="dark" aria-label="Download in dark style">
          <span class="modal-option-preview modal-option-dark">Aa</span>
          <span>Dark</span>
        </button>
      </div>

      <button class="btn-icon modal-close" id="btn-close-modal" aria-label="Cancel download">
        <svg class="icon" aria-hidden="true" width="18" height="18"><use href="#ic-x"/></svg>
      </button>
    </div>
  </dialog>


  <!-- ═══════════════════════════════════════
       TOAST NOTIFICATION
  ═══════════════════════════════════════ -->
  <div
    class="toast"
    id="toast"
    role="status"
    aria-live="polite"
    aria-atomic="true"
    hidden
  >
    <svg class="icon" aria-hidden="true" width="18" height="18"><use href="#ic-check"/></svg>
    <span id="toast-message">Copied!</span>
  </div>


  <!-- ═══════════════════════════════════════
       OFF-SCREEN EXPORT CARD (for html2canvas)
  ═══════════════════════════════════════ -->
  <div class="export-card" id="export-card" aria-hidden="true">
    <div class="export-card-inner">
      <div class="export-logo">
        <span>🕯️</span>
        <span class="export-logo-text">Luminary</span>
      </div>
      <blockquote class="export-quote" id="export-quote"></blockquote>
      <cite class="export-author" id="export-author"></cite>
      <p class="export-tagline">luminary.app</p>
    </div>
  </div>


  <!-- ═══════════════════════════════════════
       FOOTER
  ═══════════════════════════════════════ -->
  <footer class="site-footer" role="contentinfo">
    <p class="footer-text">
      Made with <span aria-label="love">♥</span> · <a href="/" class="footer-link">Luminary</a>
    </p>
  </footer>


  <!-- html2canvas (image export) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>

  <!-- Scripts -->
  <script src="quote-service.js"></script>
  <script src="app.js"></script>

</body>
</html>
